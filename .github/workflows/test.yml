name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e '.[test,sc2,storage]'
      - run: python scripts/verify_release.py
      - run: python examples/inspect_hierarchy.py
      - run: python -m pytest --collect-only -q
      - run: python -m pytest -q
